# Inline flow-style from, the notation in skills/oro-datagrid/SKILL.md.
datagrids:
    acme-blog-posts-grid:
        source:
            type: orm
            query:
                select: [d.id, d.subject]
                from: [{table: Acme\Bundle\BlogBundle\Entity\Post, alias: d}]
        columns:
            subject: {label: acme.blog.post.subject.label}
        sorters:
            columns:
                subject:
                    data_name: d.subject
        filters:
            columns:
                subject:
                    type: string
                    data_name: d.subject
